{{define "admin-rail"}}<aside class="rail" aria-label="Primary navigation">
<a class="rail-mark" href="/admin/" aria-label="authd administration" title="authd administration">{{template "icon" "brand"}}</a>
<nav class="rail-nav" aria-label="Administration">{{range adminNavigation .View}}<a class="rail-item{{if .Current}} active{{end}}" href="{{.Href}}" aria-label="{{.Label}}" title="{{.Label}}" {{if .Current}}aria-current="page"{{end}}>{{template "icon" .Icon}}</a>{{end}}</nav>
<a class="rail-item rail-bottom{{if eq .View "account"}} active{{end}}" href="/account" {{if eq .View "account"}}aria-current="page"{{end}} aria-label="Your account" title="Your account">{{template "icon" "account"}}</a>
</aside>{{end}}
