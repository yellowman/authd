services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: authd
      POSTGRES_USER: authd
      POSTGRES_PASSWORD: authd-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authd -d authd"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - authd-postgres:/var/lib/postgresql/data

volumes:
  authd-postgres:
